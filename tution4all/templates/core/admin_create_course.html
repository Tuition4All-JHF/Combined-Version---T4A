{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Course - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary m-0">{{ action|default:"Create" }} Course</h2>
            <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary rounded-pill">Back to Dashboard</a>
        </div>
        
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">{% if action == 'Edit' %}Save Changes{% else %}Publish Course{% endif %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
